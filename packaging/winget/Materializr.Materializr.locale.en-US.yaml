ReleaseNotes: |-
  Materializr 1.7.4
  Materials and grids: give each body a real material with a mass and a finish, and pattern sketches into grids.
  Added
  - Materials: give each body a 3D printing plastic (PLA, PETG, ABS, ASA, TPU, nylon and more), a metal, wood or another material, saved with the project
  - Volume and mass in Properties, plus an estimated printed mass from infill and wall count for printing plastics
  - Material finishes in the viewport: metals reflect a photographed studio, wood shows a grain (Settings > Appearance > Materials turns the reflections off)
  - Grid sketch patterns: Linear Pattern copies left, right, up and/or down with its own count and spacing per direction; two or more directions make a grid
  Changed
  - The appearance editor opens in place of the Items list, so the viewport stays usable while it is open
  Fixed
  - Every cell of a tiled sketch pattern now closes into a region that Push/Pull and Extrude can pick
